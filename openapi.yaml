openapi: 3.0.3
info:
  title: API de produtos
  version: 1.0.0
  description: |
    Contrato v1 da API de produtos, atendido pelos backends Java e Node.
    Erros seguem Problem Details (RFC 9457) com mensagens em português.
servers:
  - url: /api/v1
paths:
  /products:
    get:
      operationId: listProducts
      summary: Lista produtos com busca por nome e paginação
      parameters:
        - name: q
          in: query
          description: Trecho do nome, sem diferenciar maiúsculas e minúsculas.
          schema:
            type: string
        - name: page
          in: query
          description: Página, começando em 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: Campo de ordenação; prefixo `-` para ordem decrescente.
          schema:
            type: string
            enum: [id, -id, name, -name, quantity, -quantity]
            default: name
      responses:
        '200':
          description: Página de produtos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createProduct
      summary: Cria um produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produto criado
          headers:
            Location:
              description: URL do produto criado.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getProduct
      summary: Lê um produto
      responses:
        '200':
          description: Produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateProduct
      summary: Altera um produto
      description: |
        Envie `version` (lida no GET) para recusar a alteração com 409 se outra
        pessoa mudou o produto nesse meio-tempo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Produto alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteProduct
      summary: Exclui um produto
      responses:
        '204':
          description: Produto excluído
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    ProductInput:
      type: object
      required: [name, quantity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 45
        quantity:
          type: integer
          format: int32
          minimum: 0
          maximum: 999999999
        version:
          type: integer
          format: int64
          minimum: 0
          description: Só usado na alteração.
    Product:
      type: object
      required: [id, name, quantity, version]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 45
        quantity:
          type: integer
          format: int32
          minimum: 0
          maximum: 999999999
        version:
          type: integer
          format: int64
          minimum: 0
    ProductPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Problem:
      type: object
      required: [title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
  responses:
    BadRequest:
      description: Dados inválidos
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Produto não encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Nome repetido ou versão desatualizada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
